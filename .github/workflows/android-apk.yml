name: AZURA Android APK Build

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract source and apply AZURA patches
        shell: bash
        run: |
          unzip -q -o AZURA-Gallery-rebranded.zip
          if [ -d PrismGallery-master ]; then
            cp -a PrismGallery-master/. .
          fi
          gzip -dc patches/azura-optimization.patch.gz | git apply
          gzip -dc patches/azura-collections-logo.patch.gz | git apply
          mkdir -p app/src/main/res/drawable-nodpi
          cp app/src/main/res/drawable-nodpi/azura_logo.webp PrismGallery-master/app/src/main/res/drawable-nodpi/
          test -f settings.gradle.kts
          test -f app/build.gradle.kts
          test -f gradlew
          test -s app/src/main/res/drawable-nodpi/azura_logo.webp
          ! grep -q 'android.permission.INTERNET' app/src/main/AndroidManifest.xml
          chmod +x gradlew
          python3 - <<'PY'
          from pathlib import Path
          import textwrap
          app = Path('app/src/main/java/com/azura/gallery/AzuraApp.kt')
          s = app.read_text()
          s = s.replace('totalRam >= 6 * gb -> PerformanceProfile.HIGH', 'totalRam >= 8 * gb -> PerformanceProfile.HIGH')
          s = s.replace('PerformanceProfile.HIGH -> 6\n            PerformanceProfile.ULTRA -> 8', 'PerformanceProfile.HIGH -> 4\n            PerformanceProfile.ULTRA -> 5')
          s = s.replace('val enableCrossfade = performanceProfile == PerformanceProfile.HIGH || performanceProfile == PerformanceProfile.ULTRA', '// Avoid costly transition rendering while scrolling large photo grids.\n        val enableCrossfade = performanceProfile == PerformanceProfile.ULTRA')
          app.write_text(s)
          info = Path('app/src/main/java/com/azura/gallery/ui/screens/OneUiScreens.kt')
          s = info.read_text()
          if 'import androidx.compose.foundation.Image' not in s:
              s = s.replace('import androidx.compose.foundation.background', 'import androidx.compose.foundation.Image\nimport androidx.compose.foundation.background', 1)
          if 'import androidx.compose.ui.res.painterResource' not in s:
              s = s.replace('import androidx.compose.ui.platform.LocalContext', 'import androidx.compose.ui.res.painterResource\nimport androidx.compose.ui.platform.LocalContext', 1)
          marker = '    Card {\n        rows.forEachIndexed { index, (title, value) ->\n            if (index > 0) Divider(start = 22.dp)'
          lines = [
              '    Card {',
              '        Column(modifier = Modifier.fillMaxWidth(), horizontalAlignment = Alignment.CenterHorizontally) {',
              '            Image(painter = painterResource(id = com.azura.gallery.R.drawable.azura_logo), contentDescription = "AZURA", modifier = Modifier.padding(top = 24.dp, bottom = 8.dp).size(72.dp))',
              '            Text("AZURA", color = LocalAppTheme.current.palette.onBackground, fontSize = 24.sp, fontWeight = FontWeight.SemiBold)',
              '            Text("Gallery", color = LocalAppTheme.current.palette.accent, fontSize = 14.sp, modifier = Modifier.padding(bottom = 18.dp))',
              '        }',
              '        rows.forEachIndexed { index, (title, value) ->',
              '            if (index > 0) Divider(start = 22.dp)'
          ]
          replacement = '\n'.join(lines)
          if marker not in s:
              raise SystemExit('Info screen insertion point missing')
          info.write_text(s.replace(marker, replacement, 1))
          for xml in Path('app/src/main/res/mipmap-anydpi').glob('ic_launcher*.xml'):
              t = xml.read_text().replace('@drawable/azura_aperture', '@drawable/azura_logo')
              t = t.replace('<monochrome android:drawable="@drawable/azura_logo" />', '<monochrome android:drawable="@drawable/azura_logo" />')
              t = t.replace('<monochrome android:drawable="@drawable/azura_logo"/>', '<monochrome android:drawable="@drawable/azura_logo_monochrome"/>')
              xml.write_text(t)
          # Remove the problematic monochrome PNG resource after applying patches.
          mono = Path('app/src/main/res/drawable-nodpi/azura_logo_monochrome.png')
          if mono.exists():
              mono.unlink()
          for xml in Path('app/src/main/res/mipmap-anydpi').glob('ic_launcher*.xml'):
              t = xml.read_text().replace('@drawable/azura_logo_monochrome', '@drawable/azura_logo')
              xml.write_text(t)
          print('AZURA performance, logo, launcher icon and info screen patch applied.')
          PY

      - name: Export patched source for AZURA audit
        uses: actions/upload-artifact@v4
        with:
          name: AZURA-source-audit
          path: |
            app/
            gradle/
            gradlew
            gradle.properties
            settings.gradle.kts
            build.gradle.kts
          retention-days: 2

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: false

      - name: Install Android SDK packages
        run: sdkmanager --install 'platforms;android-34' 'build-tools;34.0.0'

      - name: Run unit tests
        run: ./gradlew --no-daemon --stacktrace testDebugUnitTest

      - name: Build Debug and Release variants
        run: ./gradlew --no-daemon --stacktrace assembleDebug assembleRelease

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: AZURA-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload unsigned Release APK for review
        uses: actions/upload-artifact@v4
        with:
          name: AZURA-release-unsigned
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Verify APK metadata
        shell: bash
        run: |
          for apk in app/build/outputs/apk/debug/*.apk app/build/outputs/apk/release/*.apk; do
            test -s "$apk"
            apkanalyzer manifest application-id "$apk"
            apkanalyzer manifest min-sdk "$apk"
            apkanalyzer manifest target-sdk "$apk"
          done
