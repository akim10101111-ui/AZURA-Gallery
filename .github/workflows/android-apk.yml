name: AZURA Android APK Build

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: azura-android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract source and apply AZURA patches
        shell: bash
        run: |
          unzip -q -o AZURA-Gallery-rebranded.zip
          if [ -d PrismGallery-master ]; then
            cp -a PrismGallery-master/. .
          fi
          gzip -dc patches/azura-optimization.patch.gz | git apply
          gzip -dc patches/azura-collections-logo.patch.gz | git apply
          gzip -dc patches/azura-brand-social.patch.gz | git apply
          mkdir -p app/src/main/res/drawable app/src/main/res/drawable-nodpi
          cat > app/src/main/res/drawable/azura_logo.xml <<'AZURA_VECTOR'
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp" android:height="108dp"
              android:viewportWidth="108" android:viewportHeight="108">
              <path android:fillColor="#0B0D11" android:pathData="M54,6A48,48 0,1 1,54 102A48,48 0,1 1,54 6Z"/>
              <path android:fillColor="#F8FAFC" android:pathData="M54,12A42,42 0,1 1,54 96A42,42 0,1 0,1 0,1 54,12Z"/>
              <path android:fillColor="#0B0D11" android:pathData="M70,26A9,9 0,1 1,70 44A9,9 0,1 1,70 26Z"/>
              <path android:fillColor="#F8FAFC" android:pathData="M70,32A3,3 0,1 1,70 38A3,3 0,1 1,70 32Z"/>
              <path android:strokeColor="#0B0D11" android:strokeWidth="4.5" android:strokeLineCap="round" android:strokeLineJoin="round" android:fillColor="#00000000" android:pathData="M15,72C24,62 33,57 40,58C49,59 56,68 62,72C66,75 70,76 74,73C80,66 85,63 90,67"/>
              <path android:strokeColor="#0EA5E9" android:strokeWidth="2.5" android:strokeLineCap="round" android:strokeLineJoin="round" android:fillColor="#00000000" android:pathData="M19,69C28,62 34,59 40,60C45,61 50,65 54,69"/>
          </vector>
          AZURA_VECTOR
          rm -f app/src/main/res/drawable-nodpi/azura_logo.webp
          rm -f app/src/main/res/drawable-nodpi/azura_aperture.png
          test -f settings.gradle.kts
          test -f app/build.gradle.kts
          test -f gradlew
          test -s app/src/main/res/drawable/azura_logo.xml
          ! grep -q 'android.permission.INTERNET' app/src/main/AndroidManifest.xml
          ! grep -RqiE 'Prism Gallery|PrismGallery|Prism' app/src/main
          chmod +x gradlew
          python3 - <<'PY'
          from pathlib import Path
          app = Path('app/src/main/java/com/azura/gallery/AzuraApp.kt')
          s = app.read_text()
          s = s.replace('totalRam >= 6 * gb -> PerformanceProfile.HIGH', 'totalRam >= 8 * gb -> PerformanceProfile.HIGH')
          s = s.replace('PerformanceProfile.HIGH -> 6\n            PerformanceProfile.ULTRA -> 8', 'PerformanceProfile.HIGH -> 4\n            PerformanceProfile.ULTRA -> 5')
          s = s.replace('val enableCrossfade = performanceProfile == PerformanceProfile.HIGH || performanceProfile == PerformanceProfile.ULTRA', '// Avoid costly transition rendering while scrolling large photo grids.\n        val enableCrossfade = performanceProfile == PerformanceProfile.ULTRA')
          app.write_text(s)
          info = Path('app/src/main/java/com/azura/gallery/ui/screens/OneUiScreens.kt')
          s = info.read_text()
          if 'import androidx.compose.foundation.Image' not in s:
              s = s.replace('import androidx.compose.foundation.background', 'import androidx.compose.foundation.Image\nimport androidx.compose.foundation.background', 1)
          if 'import androidx.compose.ui.res.painterResource' not in s:
              s = s.replace('import androidx.compose.ui.platform.LocalContext', 'import androidx.compose.ui.res.painterResource\nimport androidx.compose.ui.platform.LocalContext', 1)
          marker = '    Card {\n        rows.forEachIndexed { index, (title, value) ->\n            if (index > 0) Divider(start = 22.dp)'
          lines = [
              '    Card {',
              '        Column(modifier = Modifier.fillMaxWidth(), horizontalAlignment = Alignment.CenterHorizontally) {',
              '            Image(painter = painterResource(id = com.azura.gallery.R.drawable.azura_logo), contentDescription = "AZURA", modifier = Modifier.padding(top = 24.dp, bottom = 8.dp).size(72.dp))',
              '            Text("AZURA", color = LocalAppTheme.current.palette.onBackground, fontSize = 24.sp, fontWeight = FontWeight.SemiBold)',
              '            Text("Gallery", color = LocalAppTheme.current.palette.accent, fontSize = 14.sp, modifier = Modifier.padding(bottom = 18.dp))',
              '        }',
              '        rows.forEachIndexed { index, (title, value) ->',
              '            if (index > 0) Divider(start = 22.dp)'
          ]
          replacement = '\n'.join(lines)
          if marker not in s:
              raise SystemExit('Info screen insertion point missing')
          info.write_text(s.replace(marker, replacement, 1))
          for xml in Path('app/src/main/res/mipmap-anydpi').glob('ic_launcher*.xml'):
              t = xml.read_text().replace('@drawable/azura_aperture', '@drawable/azura_logo')
              t = t.replace('<monochrome android:drawable="@drawable/azura_logo" />', '<monochrome android:drawable="@drawable/azura_logo" />')
              t = t.replace('<monochrome android:drawable="@drawable/azura_logo"/>', '<monochrome android:drawable="@drawable/azura_logo_monochrome"/>')
              xml.write_text(t)
          # Remove the problematic monochrome PNG resource after applying patches.
          mono = Path('app/src/main/res/drawable-nodpi/azura_logo_monochrome.png')
          if mono.exists():
              mono.unlink()
          for xml in Path('app/src/main/res/mipmap-anydpi').glob('ic_launcher*.xml'):
              t = xml.read_text().replace('@drawable/azura_logo_monochrome', '@drawable/azura_logo')
              xml.write_text(t)
          print('AZURA performance, logo, launcher icon and info screen patch applied.')
          PY

      - name: Set app display name to Gallery and validate resources
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          files=list(Path('app/src/main/res').glob('values*/strings.xml'))
          changed=0
          for p in files:
              source=p.read_text()
              result=re.sub(r'(<string\s+name="app_name"[^>]*>).*?(</string>)',r'\1Gallery\2',source,flags=re.S)
              if result!=source:
                  p.write_text(result); changed+=1
          if changed==0:
              raise SystemExit('No app_name string found; refusing to build with wrong display name')
          ui=Path('app/src/main/java/com/azura/gallery/ui/screens/OneUiScreens.kt')
          if ui.exists():
              source=ui.read_text().replace('Text("AZURA", color = LocalAppTheme.current.palette.onBackground','Text("Gallery", color = LocalAppTheme.current.palette.onBackground')
              ui.write_text(source)
          assert Path('app/src/main/res/drawable/azura_logo.xml').exists()
          assert not Path('app/src/main/res/drawable-nodpi/azura_logo.webp').exists()
          print(f'Gallery app label verified in {changed} values files')
          PY

      - name: Apply Gallery link, naming and performance fixes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          menu = Path('app/src/main/java/com/azura/gallery/ui/screens/MenuScreen.kt')
          if menu.exists():
              s = menu.read_text()
              s = s.replace('internal const val APP_FULL_NAME = "AZURA Gallery"', 'internal const val APP_FULL_NAME = "Gallery"')
              s = s.replace('Triple("Telegram", Icons.AutoMirrored.Rounded.Send, "https://t.me/")', 'Triple("Telegram", Icons.AutoMirrored.Rounded.Send, "https://t.me/AZURAGalley")')
              s = s.replace('Triple("MAX", Icons.Rounded.Forum, "https://max.ru/")', 'Triple("MAX", Icons.Rounded.Forum, "https://max.ru/join/5IMBDNNMCur_L5zhLjR0mMXtZltlnopZ3wIuTK8Ip584")')
              nl = chr(10)
              old_click = 'runCatching {' + nl + '                                context.startActivity(Intent(Intent.ACTION_VIEW, Uri.parse(link.third)))' + nl + '                            }'
              s = s.replace(old_click, 'openGallerySocialLink(context, link.first, link.third)')
              s = s.replace('Text("AZURA Gallery", color = palette.textMuted', 'Text("Gallery", color = palette.textMuted')
              s = s.replace('contentDescription = "AZURA Gallery"', 'contentDescription = "Gallery"')
              if 'private fun openGallerySocialLink' not in s:
                  helper = [
                      '',
                      '/** Opens Telegram directly, with a browser fallback to the official channel. */',
                      'private fun openGallerySocialLink(context: android.content.Context, label: String, webUrl: String) {',
                      '    val appUri = if (label == "Telegram") android.net.Uri.parse("tg://resolve?domain=AZURAGalley") else null',
                      '    if (appUri != null) {',
                      '        try {',
                      '            context.startActivity(android.content.Intent(android.content.Intent.ACTION_VIEW, appUri))',
                      '            return',
                      '        } catch (_: android.content.ActivityNotFoundException) { }',
                      '    }',
                      '    try {',
                      '        context.startActivity(android.content.Intent(android.content.Intent.ACTION_VIEW, android.net.Uri.parse(webUrl)))',
                      '    } catch (_: android.content.ActivityNotFoundException) {',
                      '        try {',
                      '            context.startActivity(android.content.Intent.createChooser(android.content.Intent(android.content.Intent.ACTION_VIEW, android.net.Uri.parse(webUrl)), label))',
                      '        } catch (_: Exception) { }',
                      '    }',
                      '}',
                      ''
                  ]
                  s += nl.join(helper)
              s = s.replace('import android.content.Intent\\n', '').replace('import android.net.Uri\\n', '')
              menu.write_text(s)
          strings = Path('app/src/main/java/com/azura/gallery/ui/i18n/Strings.kt')
          if strings.exists():
              strings.write_text(strings.read_text().replace('AZURA Gallery', 'Gallery').replace('AZURA', 'Gallery'))
          for p in [Path('app/src/main/res/values/strings.xml'), Path('app/src/main/res/values-ru/strings.xml')]:
              if p.exists():
                  p.write_text(p.read_text().replace('AZURA', 'Gallery'))
          perf = Path('app/src/main/java/com/azura/gallery/AzuraApp.kt')
          if perf.exists():
              s = perf.read_text()
              s = s.replace('PerformanceProfile.HIGH -> 4\\n            PerformanceProfile.ULTRA -> 6', 'PerformanceProfile.HIGH -> 3\\n            PerformanceProfile.ULTRA -> 4')
              s = s.replace('PerformanceProfile.HIGH -> 0.20\\n            PerformanceProfile.ULTRA -> 0.25', 'PerformanceProfile.HIGH -> 0.18\\n            PerformanceProfile.ULTRA -> 0.22')
              s = s.replace('val enableCrossfade = performanceProfile == PerformanceProfile.HIGH || performanceProfile == PerformanceProfile.ULTRA', 'val enableCrossfade = performanceProfile == PerformanceProfile.ULTRA')
              perf.write_text(s)
          thumb = Path('app/src/main/java/com/azura/gallery/data/ThumbnailManager.kt')
          if thumb.exists():
              s = thumb.read_text()
              s = s.replace('PerformanceProfile.MEDIUM -> 144', 'PerformanceProfile.MEDIUM -> 128')
              s = s.replace('PerformanceProfile.HIGH -> 192', 'PerformanceProfile.HIGH -> 160')
              s = s.replace('PerformanceProfile.ULTRA -> 256', 'PerformanceProfile.ULTRA -> 224')
              s = s.replace('if (quality == PerformanceProfile.LOW) return', 'if (quality != PerformanceProfile.ULTRA) return')
              thumb.write_text(s)
          print('Gallery branding, links and performance fixes applied')
          PY

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: false

      - name: Install Android SDK packages
        run: sdkmanager --install 'platforms;android-34' 'build-tools;34.0.0'

      - name: Run unit tests
        run: ./gradlew --no-daemon --stacktrace clean testDebugUnitTest

      - name: Build Debug, Release and App Bundle
        run: ./gradlew --no-daemon --stacktrace assembleDebug assembleRelease bundleRelease

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: AZURA-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload unsigned Release APK for review
        uses: actions/upload-artifact@v4
        with:
          name: AZURA-release-unsigned
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload Release App Bundle
        uses: actions/upload-artifact@v4
        with:
          name: AZURA-release-aab-unsigned
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 14

      - name: Verify APK metadata and debug signature
        shell: bash
        run: |
          for apk in app/build/outputs/apk/debug/*.apk app/build/outputs/apk/release/*.apk; do
            test -s "$apk"
            app_id="$(apkanalyzer manifest application-id "$apk")"
            min_sdk="$(apkanalyzer manifest min-sdk "$apk")"
            target_sdk="$(apkanalyzer manifest target-sdk "$apk")"
            echo "$apk: applicationId=$app_id minSdk=$min_sdk targetSdk=$target_sdk"
            test "$app_id" = "com.azura.gallery"
            test "$min_sdk" = "29"
            test "$target_sdk" = "34"
          done
          signer="$ANDROID_HOME/build-tools/34.0.0/apksigner"
          test -x "$signer"
          "$signer" verify --verbose app/build/outputs/apk/debug/app-debug.apk

      - name: Package Android Studio project
        shell: bash
        run: |
          zip -qr AZURA-AndroidStudio-Project.zip \
            README.md .gitignore keystore.properties.example \
            gradle gradlew gradlew.bat gradle.properties \
            settings.gradle.kts build.gradle.kts app ruStore patches brand \
            -x 'app/build/*' 'app/.gradle/*' '**/.DS_Store'

      - name: Upload Android Studio project
        uses: actions/upload-artifact@v4
        with:
          name: AZURA-AndroidStudio-Project
          path: AZURA-AndroidStudio-Project.zip
          if-no-files-found: error
          retention-days: 14

      - name: Run Android lint
        run: ./gradlew --no-daemon --stacktrace lintDebug
