name: AZURA Android APK Build

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract source archive and apply AZURA improvements
        shell: bash
        run: |
          if [ -f AZURA-Gallery-rebranded.zip ]; then
            unzip -q -o AZURA-Gallery-rebranded.zip
            if [ -d PrismGallery-master ]; then
              cp -a PrismGallery-master/. .
            fi
          fi
          if [ -f patches/azura-optimization.patch.gz ]; then
            gzip -dc patches/azura-optimization.patch.gz | git apply
          fi
          test -f settings.gradle.kts
          test -f app/build.gradle.kts
          test -f gradlew
          chmod +x gradlew

      - name: Package extracted source for review
        shell: bash
        run: |
          tar -czf /tmp/AZURA-extracted-source.tar.gz \
            --exclude=.git --exclude=.gradle --exclude='*/build' \
            --exclude=AZURA-Gallery-rebranded.zip .

      - name: Upload extracted source
        uses: actions/upload-artifact@v4
        with:
          name: AZURA-extracted-source
          path: /tmp/AZURA-extracted-source.tar.gz
          if-no-files-found: error
          retention-days: 7

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: false

      - name: Install Android SDK packages
        run: sdkmanager --install 'platforms;android-34' 'build-tools;34.0.0'

      - name: Build Debug APK
        run: ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: AZURA-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
